<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>在线评测 · ReAct-Manip</title>
  <link rel="stylesheet" href="web-portal.css?v=20261126-web1">
  <script src="config.js?v=20261126-web1" defer></script>
  <script src="web-portal.js?v=20261126-web1" defer></script>
</head>
<body>
  <header><a class="brand" href="https://qlab-ai.org/react-manip-site/">ReAct-Manip</a><nav><a href="https://qlab-ai.org/react-manip-site/eval/records.html">已发布评测记录</a><a href="mailto:weikeming@qlab.team">联系我们</a></nav></header>
  <main>
    <p class="eyebrow">模型评测</p><h1>从提交到回看，一处完成。</h1>
    <p class="intro">在工作站运行 GPU 仿真，保存每次评测的记录和视频，完成后在线查看。</p>
    <p id="service" class="notice" role="status">正在连接评测服务…</p>
    <section aria-labelledby="account-title">
      <div class="section-top"><h2 id="account-title">团队登录</h2><button id="logout" type="button" hidden>退出登录</button></div>
      <form id="login"><label>账户名<input name="team" maxlength="80" autocomplete="username" required></label><label>密码<input name="password" type="password" maxlength="200" autocomplete="current-password" required></label><button class="primary" type="submit" disabled>登录</button></form>
      <p id="account" role="status">使用部署时创建的团队账户。刷新页面后需要重新登录。</p>
    </section>
    <section aria-labelledby="submission-title">
      <h2 id="submission-title">新建评测</h2>
      <form id="submit"><fieldset id="submit-controls" disabled>
        <div class="fields"><label>模型<input value="gpt-6-astra" readonly></label><label>推理强度<input value="high" readonly></label>
        <label>评测范围<select id="mode"><option value="acceptance">连接验收 · 1 回合 / 最多 6 步</option><option id="full-option" value="full" disabled>完整评测 · 16 个任务 / 720 回合</option></select></label>
        <label>验收任务<select id="task"></select></label></div>
        <p class="hint" id="scope">连接验收会真实调用模型、运行 GPU 仿真并保存视频。它不产生完整基准评分，模型推理可能需要几分钟。</p>
        <button class="primary" id="submit-button" type="submit">提交评测</button>
      </fieldset></form><p id="submission-state" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="records-title">
      <div class="section-top"><h2 id="records-title">我的评测记录</h2><button id="refresh" type="button" disabled>刷新</button></div>
      <p class="hint">仅当前账户可查看。归档完成后，视频从 OSS 归档读取。</p>
      <div id="jobs" role="list"><p>登录后显示评测记录。</p></div>
      <article id="detail" hidden><div class="section-top"><h3 id="detail-title">评测详情</h3><button id="cancel" type="button" hidden>取消评测</button></div>
        <p id="detail-state" role="status"></p><div id="facts" class="facts"></div>
        <div id="episodes" class="table-wrap"></div><div id="videos"></div>
        <p id="media-state" role="status"></p><video id="player" controls playsinline preload="metadata" hidden></video>
        <a id="download" hidden>下载当前视频</a>
      </article>
    </section><noscript>请启用 JavaScript 后使用评测服务。</noscript>
  </main><footer>ReAct-Manip · <a href="mailto:weikeming@qlab.team">weikeming@qlab.team</a></footer>
</body></html>
